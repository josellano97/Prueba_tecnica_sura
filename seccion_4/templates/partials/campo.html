{# Campo de formulario accesible: etiqueta, ayuda y errores asociados al control. #}
<div class="campo{% if campo.errors %} con-error{% endif %}{% if campo.field.widget.input_type == 'checkbox' %} campo-casilla{% endif %}">
  {% if campo.field.widget.input_type == 'checkbox' %}
    <label class="casilla">{{ campo }} <span>{{ campo.label }}</span></label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="obligatorio" aria-hidden="true">*</span>{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<small class="ayuda" id="{{ campo.id_for_label }}_ayuda">{{ campo.help_text|safe }}</small>{% endif %}
  {% for e in campo.errors %}<small class="error-campo" role="alert">{{ e }}</small>{% endfor %}
</div>
