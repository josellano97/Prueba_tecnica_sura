{% if form.errors %}
<div class="aviso aviso-error" role="alert">
  <svg class="icono" aria-hidden="true"><use href="#i-alerta"></use></svg>
  <span>{% if form.non_field_errors %}{% for e in form.non_field_errors %}{{ e }} {% endfor %}{% else %}Revise los campos marcados.{% endif %}</span>
</div>
{% endif %}
