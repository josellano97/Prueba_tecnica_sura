{% if is_paginated %}
<nav class="paginacion" aria-label="Paginación">
  {% if page_obj.has_previous %}<a class="btn btn-pequeno" href="?{% for k, v in filtros.items %}{% if v %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn btn-pequeno" href="?{% for k, v in filtros.items %}{% if v %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}
</nav>
{% endif %}
